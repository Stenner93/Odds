name: Bzzoiro-backfill

# Engangs: læg Bzzoiros historiske S4-forudsigelser (lavet før kickoff) i
# data/predictor_log.csv og genbyg dashboardet.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-pipeline
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backfill
        run: python tools/bzz_backfill.py
        env:
          BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
      - name: Genbyg dashboard
        run: python scripts/08_dashboard.py
      - name: Commit og push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/predictor_log.csv index.html
          git diff --cached --quiet && echo "Ingen ændringer" && exit 0
          git commit -m "Bzzoiro-backfill: historiske S4-forudsigelser i predictor_log [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main && git rebase origin/main || { git checkout --theirs index.html; git add index.html; GIT_EDITOR=true git rebase --continue; }
            python scripts/08_dashboard.py && git add index.html && (git diff --cached --quiet || git commit -m "Auto: dashboard genbygget [skip ci]")
          done
          exit 1
