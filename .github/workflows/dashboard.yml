name: Opdater dashboard

on:
  schedule:
    # Man–tor + lør–søn kl. 05:30 UTC (07:30 dansk sommertid / 06:30 vintertid):
    # rutine-opdatering — odds, resultater, stilling, dashboard (UDEN Cognito-scraping)
    - cron: '30 5 * * 0-4,6'
    # Fredag "gør det hele" inkl. Cognito-scraping — sigter på ~07:17 dansk året rundt.
    # Minuttallet er skudt til :17 (væk fra :00) for at mindske risikoen for at GitHub
    # dropper cron'en — planlagte kørsler på det runde time-slot droppes oftest ved høj last.
    # GitHub-cron er kun UTC, så vi deler på sommer-/vintertid:
    #   Apr–okt (sommertid CEST = UTC+2): 05:17 UTC ≈ 07:17 dansk
    - cron: '17 5 * 4-10 5'
    #   Nov–mar (vintertid CET = UTC+1): 06:17 UTC ≈ 07:17 dansk
    - cron: '17 6 * 1-3,11-12 5'

  workflow_dispatch:
    inputs:
      hent_kampe:
        description: 'Hent kampe fra Cognito Forms?'
        type: boolean
        default: false
      hent_odds:
        description: 'Hent odds? (bruger API-kald ~10/runde)'
        type: boolean
        default: false
      indlaes_gaet:
        description: 'Parser gæt fra gaet_input.txt?'
        type: boolean
        default: true
      hent_resultater:
        description: 'Hent resultater automatisk?'
        type: boolean
        default: true
      beregn_stilling:
        description: 'Beregn point og stilling?'
        type: boolean
        default: true
      opdater_dashboard:
        description: 'Generer og publicer dashboard?'
        type: boolean
        default: true

  push:
    branches: [main]
    paths:
      - 'data/**.csv'
      - 'data/**.json'
      - 'data/kupon_input.txt'
      - 'data/gaet_input.txt'
      - 'data/h2h_order.txt'
      - 'data/dashboard_template.html'
      # Manuel trigger af Cognito-scrape via push (sikkerhedsnet mod forsinket cron)
      - 'data/scrape_trigger.txt'

permissions:
  contents: write

# Kør aldrig to pipelines samtidig: den der blev færdig sidst fik før sin push
# afvist (non-fast-forward), og dens data — fx en fredags-scrape — gik tabt.
concurrency:
  group: dashboard-pipeline
  cancel-in-progress: false

jobs:
  byg-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repo
        uses: actions/checkout@v4

      - name: Opsæt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Installer pakker
        run: pip install -r requirements.txt

      - name: Installer Playwright (kun ved Cognito-scraping)
        if: github.event.inputs.hent_kampe == 'true' || github.event.schedule == '17 5 * 4-10 5' || github.event.schedule == '17 6 * 1-3,11-12 5' || contains(github.event.head_commit.message, '[scrape]')
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: 01 — Hent kampe fra Cognito
        if: github.event.inputs.hent_kampe == 'true' || github.event.schedule == '17 5 * 4-10 5' || github.event.schedule == '17 6 * 1-3,11-12 5' || contains(github.event.head_commit.message, '[scrape]')
        run: python scripts/01_kampe.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 06 — Opdater hold_mapping.json med nye hold
        if: github.event.inputs.hent_kampe == 'true' || github.event.schedule == '17 5 * 4-10 5' || github.event.schedule == '17 6 * 1-3,11-12 5' || contains(github.event.head_commit.message, '[scrape]')
        run: python scripts/06_mapping_update.py

      - name: 02 — Hent odds og model-forudsigelser
        if: >
          github.event_name == 'schedule' ||
          github.event_name == 'push' ||
          github.event.inputs.hent_odds == 'true'
        run: python scripts/02_odds.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}

      - name: 03 — Indlæs spillernes gæt
        if: >
          github.event_name == 'schedule' ||
          github.event.inputs.indlaes_gaet == 'true' ||
          (github.event_name == 'push' && contains(github.event.head_commit.modified, 'data/gaet_input.txt'))
        run: python scripts/03_bets.py

      - name: 04 — Hent kampresultater
        if: >
          github.event_name == 'schedule' ||
          github.event.inputs.hent_resultater == 'true' ||
          github.event_name == 'push'
        run: python scripts/04_results.py
        env:
          BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}

      - name: 05 — Beregn point og stilling
        if: >
          github.event_name == 'schedule' ||
          github.event.inputs.beregn_stilling == 'true' ||
          github.event_name == 'push'
        run: python scripts/05_standings.py

      - name: 08 — Generer dashboard (inkl. Forside-fane)
        if: >
          github.event_name == 'schedule' ||
          github.event.inputs.opdater_dashboard == 'true' ||
          github.event_name == 'push'
        run: python scripts/08_dashboard.py

      - name: Commit og push ændringer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          git diff --cached --quiet && echo "Ingen ændringer" && exit 0
          git commit -m "Auto: pipeline kørt [skip ci]"
          # Push med genforsøg: hvis main er rykket imens (fx en manuel commit),
          # læg vores commit ovenpå og genbyg dashboardet. Konflikt i index.html
          # løses ved genbygning; konflikt i data/ stopper kørslen tydeligt.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push afvist — henter main og prøver igen ($i/3)"
            git fetch origin main
            if ! git rebase origin/main; then
              C=$(git diff --name-only --diff-filter=U)
              if [ "$C" = "index.html" ]; then
                git checkout --theirs index.html && git add index.html
                GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
              else
                echo "::error::Rebase-konflikt i: $C"; git rebase --abort; exit 1
              fi
            fi
            python scripts/08_dashboard.py && git add index.html
            git diff --cached --quiet || git commit -m "Auto: dashboard genbygget efter rebase [skip ci]"
          done
          exit 1
